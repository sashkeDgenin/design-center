<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LeadDesk is offline</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        background: #f5f6f8; color: #16181d; padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        background: #fff; border: 1px solid #e3e5ea; border-radius: 14px;
        padding: 28px 24px; max-width: 22rem; text-align: center;
        box-shadow: 0 1px 2px rgb(0 0 0 / 5%);
      }
      h1 { font-size: 1.125rem; margin: 0 0 6px; }
      p { font-size: 0.875rem; color: #5b6070; margin: 0 0 18px; line-height: 1.5; }
      button {
        min-height: 44px; width: 100%; border: 0; border-radius: 12px;
        background: #16181d; color: #fff; font: inherit; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>No connection.</h1>
      <p>
        Your leads live on the server, so LeadDesk needs signal to show them. Nothing is
        lost. Try again once you have a bar or two.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
